<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="img/pusheenimg.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e3d3f8 0%, #d0f0eb 50%, #fbe2ee 100%);
        }
        .btn-pastel {
            background-color: #b28dd4;
            color: white;
            border: none;
        }
        .btn-pastel:hover {
            background-color: #9d73c7;
            color: white;
        }
        .form-control:focus {
            border-color: #b28dd4;
            box-shadow: 0 0 0 0.25rem rgba(178, 141, 212, 0.25);
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center vh-100 m-0">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">
                <div class="card p-4 p-md-5 shadow-lg border-0 rounded-5 text-center">
                    <div class="mb-3">
                        <img src="img/pusheenimg.png" alt="Usuario" width="230" class="img-fluid">
                    </div>
                    <h2 class="mb-4 fw-bold" style="color: #6c5b7b;">Bienvenido</h2>
                    <form id="loginForm">
                        <div class="mb-4 text-start">
                            <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control form-control-lg" id="email" placeholder="Usuario" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label for="password" class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control form-control-lg" id="password" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-pastel btn-lg w-100 py-3 mt-2 fw-bold">Ingresar</button>
                    </form>
                    <div id="error" class="alert alert-danger mt-3 mb-0 p-2 d-none" role="alert">
                        Correo o contraseña incorrectos.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            // Credenciales Administrador
            const adminEmail = "admin@correo.com";
            const adminPass = "123456";

            // Credenciales Operario
            const operarioEmail = "operario@correo.com";
            const operarioPass = "123456";

            const emailIngresado = document.getElementById('email').value.trim();
            const passwordIngresada = document.getElementById('password').value;
            const errorElemento = document.getElementById('error');

            // Ocultar mensaje de error previo si existía
            errorElemento.classList.add('d-none');

            if (emailIngresado === adminEmail && passwordIngresada === adminPass) {
                window.location.href = "admin_home.html";
            } else if (emailIngresado === operarioEmail && passwordIngresada === operarioPass) {
                window.location.href = "operario/operario_home.html";
            } else {
                errorElemento.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
